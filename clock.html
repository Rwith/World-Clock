<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>
  <link rel="stylesheet" href="clock.css" />
</head>
<body>
  <div id="widget">
    <div class="wg-header" id="drag-handle">
      <span class="wg-name" id="wg-name">City</span>
      <button class="wg-close" id="wg-close" title="Close">&#215;</button>
    </div>
    <div class="wg-time" id="wg-time">--:--:--</div>
    <div class="wg-date" id="wg-date">---</div>
    <div class="wg-tz"   id="wg-tz">UTC</div>
  </div>
  <script src="clock.js"></script>
</body>
</html>
