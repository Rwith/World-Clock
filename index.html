<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Clock</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>&#127758; World Clock</h1>
    <div id="local-time">
      <span id="local-city">Your Location</span>
      <span id="local-clock">--:--:--</span>
      <span id="local-date">---</span>
    </div>
  </header>

  <div id="map"></div>

  <div id="city-panel">
    <div id="city-panel-header">
      <span class="panel-label">City Times</span>
      <div id="city-add-controls">
        <select id="city-select">
          <option value="">&#8212; Add a city &#8212;</option>
        </select>
        <button id="add-city-btn">+ Add</button>
      </div>
      <span id="drag-hint">&#8689; Drag any card to create a floating desktop clock</span>
    </div>
    <div id="city-cards"></div>
  </div>

  <div id="floating-clocks"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
